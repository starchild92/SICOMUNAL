comites_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\ComiteController::indexAction" }
    methods:  GET

comites_show:
    path:     /{id}/mostrar
    defaults: { _controller: "SICBundle\\Controller\\ComiteController::showAction" }
    methods:  GET

comites_new:
    path:     /nuevo
    defaults: { _controller: "SICBundle\\Controller\\ComiteController::newAction" }
    methods:  [GET, POST]

comites_edit:
    path:     /{id}/editar
    defaults: { _controller: "SICBundle\\Controller\\ComiteController::editAction" }
    methods:  [GET, POST]

comites_delete:
    path:     /{id}/eliminar
    defaults: { _controller: "SICBundle\\Controller\\ComiteController::deleteAction" }
    methods:  DELETE
