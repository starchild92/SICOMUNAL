configurable_pensionados_instituciones_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\AdminPensionadoInstitucionController::indexAction" }
    methods:  GET

configurable_pensionados_instituciones_show:
    path:     /{id}/show
    defaults: { _controller: "SICBundle\\Controller\\AdminPensionadoInstitucionController::showAction" }
    methods:  GET

configurable_pensionados_instituciones_new:
    path:     /new
    defaults: { _controller: "SICBundle\\Controller\\AdminPensionadoInstitucionController::newAction" }
    methods:  [GET, POST]

configurable_pensionados_instituciones_edit:
    path:     /{id}/edit
    defaults: { _controller: "SICBundle\\Controller\\AdminPensionadoInstitucionController::editAction" }
    methods:  [GET, POST]

configurable_pensionados_instituciones_delete:
    path:     /{id}/delete
    defaults: { _controller: "SICBundle\\Controller\\AdminPensionadoInstitucionController::deleteAction" }
    methods:  DELETE
