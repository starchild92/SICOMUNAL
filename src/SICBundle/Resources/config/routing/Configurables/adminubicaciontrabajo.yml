configurable_ubicacion-trabajo_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\AdminUbicacionTrabajoController::indexAction" }
    methods:  GET

configurable_ubicacion-trabajo_show:
    path:     /{id}/show
    defaults: { _controller: "SICBundle\\Controller\\AdminUbicacionTrabajoController::showAction" }
    methods:  GET

configurable_ubicacion-trabajo_new:
    path:     /new
    defaults: { _controller: "SICBundle\\Controller\\AdminUbicacionTrabajoController::newAction" }
    methods:  [GET, POST]

configurable_ubicacion-trabajo_edit:
    path:     /{id}/edit
    defaults: { _controller: "SICBundle\\Controller\\AdminUbicacionTrabajoController::editAction" }
    methods:  [GET, POST]

configurable_ubicacion-trabajo_delete:
    path:     /{id}/delete
    defaults: { _controller: "SICBundle\\Controller\\AdminUbicacionTrabajoController::deleteAction" }
    methods:  DELETE
