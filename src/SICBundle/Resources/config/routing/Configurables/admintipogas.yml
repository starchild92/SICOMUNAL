configurables_tipos_gas_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoGasController::indexAction" }
    methods:  GET

configurables_tipos_gas_show:
    path:     /{id}/show
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoGasController::showAction" }
    methods:  GET

configurables_tipos_gas_new:
    path:     /new
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoGasController::newAction" }
