configurable_tipo_techo_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTechoController::indexAction" }
    methods:  GET

configurable_tipo_techo_show:
    path:     /{id}/show
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTechoController::showAction" }
    methods:  GET

configurable_tipo_techo_new:
    path:     /new
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTechoController::newAction" }
    methods:  [GET, POST]

configurable_tipo_techo_edit:
    path:     /{id}/edit
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTechoController::editAction" }
    methods:  [GET, POST]

configurable_tipo_techo_delete:
    path:     /{id}/delete
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTechoController::deleteAction" }
    methods:  DELETE
