configurables_tipo_telefonia_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTelefoniaController::indexAction" }
    methods:  GET

configurables_tipo_telefonia_show:
    path:     /{id}/show
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTelefoniaController::showAction" }
    methods:  GET

configurables_tipo_telefonia_new:
    path:     /new
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTelefoniaController::newAction" }
