configurables_tipo_telefonia_edit:
    path:     /{id}/edit
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTelefoniaController::editAction" }
    methods:  [GET, POST]

configurables_tipo_telefonia_delete:
    path:     /{id}/delete
    defaults: { _controller: "SICBundle\\Controller\\AdminTipoTelefoniaController::deleteAction" }
