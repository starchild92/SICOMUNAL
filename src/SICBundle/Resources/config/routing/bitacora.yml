bitacora_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::indexAction" }
    methods:  GET

bitacora_show:
    path:     /{id}/mostrar
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::showAction" }
    methods:  GET

bitacora_new:
    path:     /nueva
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::newAction" }
    methods:  [GET, POST]

bitacora_edit:
    path:     /{id}/editar
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::editAction" }
    methods:  [GET, POST]

bitacora_delete:
    path:     /{id}/eliminar
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::deleteAction" }
    methods:  DELETE

bitacora_filtrar:
    path:     /por
    defaults: { _controller: "SICBundle\\Controller\\BitacoraController::porAction" }
    methods:  [POST, DELETE]