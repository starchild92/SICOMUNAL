usuarios_index:
    path:     /
    defaults: { _controller: "SICBundle\\Controller\\UsuarioController::indexAction" }
    methods:  GET

usuarios_show:
    path:     /{id}/mostrar
    defaults: { _controller: "SICBundle\\Controller\\UsuarioController::showAction" }
    methods:  GET

usuarios_new:
    path:     /nuevo
    defaults: { _controller: "SICBundle\\Controller\\UsuarioController::newAction" }
    methods:  [GET, POST]

usuarios_edit:
    path:     /{id}/editarar
    defaults: { _controller: "SICBundle\\Controller\\UsuarioController::editAction" }
    methods:  [GET, POST]

usuarios_delete:
    path:     /{id}/eliminar
    defaults: { _controller: "SICBundle\\Controller\\UsuarioController::deleteAction" }
    methods:  DELETE
