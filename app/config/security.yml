security:
    password_hashers:
        SICBundle\Entity\Usuario:
            algorithm: bcrypt

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        app_user_provider:
            entity:
                class: SICBundle\Entity\Usuario
                property: username

    access_control:
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/register, role: PUBLIC_ACCESS }
        - { path: ^/resetting, role: PUBLIC_ACCESS }
        - { path: ^/administrar/, role: ROLE_ADMIN }
        - { path: ^/usuarios/nuevo, role: ROLE_ADMIN }

    access_denied_url: /

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            pattern: ^/
            provider: app_user_provider
            form_login:
                login_path: /login
                check_path: /login_check
                enable_csrf: true
            logout:
                path: /logout
                target: /
            lazy: true
