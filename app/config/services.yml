parameters:
    locale: es

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    SICBundle\Controller\:
        resource: '../../src/SICBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    SICBundle\Form\:
        resource: '../../src/SICBundle/Form'

    app.form.registration:
        class: SICBundle\Form\UsuarioType
        tags:
            - { name: form.type, alias: app_user_registration }

    sic.form.type.genero:
        class: SICBundle\Form\GeneroType
        arguments:
            - '%generos%'
        tags:
            - { name: form.type }
